include:
  - _pages

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - vendor

defaults:
  - scope:
      path: ""
    values:
      layout: default
      image: /assets/img/matheus-horacio.jpg
