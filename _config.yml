title: "Matheus Horácio — Caderno de geometria"
description: "Um caderno bilíngue sobre geometria diferencial, fluxo de Ricci e escrita matemática."
url: "https://sagangromov.github.io"
baseurl: ""
lang: "pt-BR"
timezone: "America/Sao_Paulo"

author:
  name: "Matheus Horácio"
  email: "matheus.andrade5488@gmail.com"

markdown: kramdown
kramdown:
  input: GFM
permalink: pretty
strict_front_matter: true

plugins:
