{% assign locale = page.locale %}
<div class="resource-list">
  {% for group in site.data.resources %}
    <section class="resource-block">
      <div class="resource-symbol" aria-hidden="true">{{ group.symbol }}</div>
      <div class="resource-intro">
        <p class="meta-label">0{{ forloop.index }}</p>
        <h2>{{ group.title[locale] }}</h2>
        <p>{{ group.description[locale] }}</p>
      </div>
      <div class="resource-links">
        {% for link in group.links %}
          <article>
            <h3><a href="{{ link.url }}" target="_blank" rel="noopener noreferrer">{{ link.name }} <span aria-hidden="true">↗</span></a></h3>
            <p>{{ link.note[locale] }}</p>
          </article>
        {% endfor %}
      </div>
    </section>
  {% endfor %}
</div>
